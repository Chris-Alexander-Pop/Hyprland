name: Rebase patched onto upstream

# Weekly sync of the patched branch with hyprwm/Hyprland main.
# On conflict: fail the job and open/update a tracking issue so it is visible.

on:
  schedule:
    - cron: "0 6 * * 1" # Mondays 06:00 UTC
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: rebase-patched-upstream
  cancel-in-progress: false

jobs:
  rebase:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout patched branch
        uses: actions/checkout@v4
        with:
          ref: patched
          fetch-depth: 0

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Fetch upstream Hyprland main
        run: |
          git remote add upstream https://github.com/hyprwm/Hyprland.git
          git fetch upstream main

      - name: Rebase patched onto upstream/main
        id: rebase
        run: |
          set -euo pipefail
          if git rebase upstream/main; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "ok=false" >> "$GITHUB_OUTPUT"
            {
              echo "## Conflicted files"
              git diff --name-only --diff-filter=U || true
              echo
              echo "## Status"
              git status || true
            } >> "$GITHUB_STEP_SUMMARY"
            git rebase --abort || true
            exit 1
          fi

      - name: Push rebased branch
        if: steps.rebase.outputs.ok == 'true'
        run: git push --force-with-lease origin patched

      - name: Close stale conflict issue on success
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ids=$(gh issue list --repo "$GITHUB_REPOSITORY" --label "rebase-conflict" --state open --json number -q '.[].number')
          for id in $ids; do
            gh issue close "$id" --repo "$GITHUB_REPOSITORY" \
              --comment "Resolved: weekly rebase of \`patched\` onto upstream/main succeeded in run ${{ github.run_id }}."
          done

      - name: Open or update conflict issue
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          title="rebase-conflict: patched vs upstream/main"
          body=$(cat <<EOF
          ## Weekly rebase failed

          The \`patched\` branch could not rebase onto \`hyprwm/Hyprland\` \`main\`.

          **Run:** ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

          ### Local fix

          \`\`\`bash
          cd ~/Engineering/Productivity/Hyprland
          git fetch upstream main
          git checkout patched
          git rebase upstream/main
          # resolve conflicts…
          git push --force-with-lease origin patched
          sync-hypr-patched.sh
          \`\`\`

          Until this is fixed, Arch \`hyprutils\` / \`aquamarine\` upgrades can break \`hyprland-patched\` (missing \`.so\` SONAMEs).
          EOF
          )
          existing=$(gh issue list --repo "$GITHUB_REPOSITORY" --label "rebase-conflict" --state open --json number -q '.[0].number // empty')
          if [[ -n "$existing" ]]; then
            gh issue comment "$existing" --repo "$GITHUB_REPOSITORY" --body "$body"
          else
            gh label create "rebase-conflict" --repo "$GITHUB_REPOSITORY" --color "D93F0B" --description "patched branch failed to rebase onto upstream" 2>/dev/null || true
            gh issue create --repo "$GITHUB_REPOSITORY" --title "$title" --label "rebase-conflict" --body "$body"
          fi
